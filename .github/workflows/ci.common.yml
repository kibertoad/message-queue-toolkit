name: Common CI
on:
  workflow_call:
    inputs:
      package_name:
        required: true
        type: string
      node_version:
        required: true
        type: string
      queue_backend:
        required: false
        type: string
        default: 'fauxqs'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node ${{ inputs.node_version }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node_version }}
          cache: 'pnpm'

      - name: Install
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build TS
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: pnpm run build --filter="$PACKAGE_NAME"

      - name: Run lint
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: pnpm run lint --filter="$PACKAGE_NAME"

      - name: Docker start
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          QUEUE_BACKEND: ${{ inputs.queue_backend }}
        run: pnpm run docker:start:ci --filter="$PACKAGE_NAME"

      - name: Run Tests
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          QUEUE_BACKEND: ${{ inputs.queue_backend }}
        run: |
          echo "::notice::Running $PACKAGE_NAME with QUEUE_BACKEND=$QUEUE_BACKEND"
          pnpm run test:ci --filter="$PACKAGE_NAME"

      - name: Docker stop
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          QUEUE_BACKEND: ${{ inputs.queue_backend }}
        run: pnpm run docker:stop:ci --filter="$PACKAGE_NAME"
