packages:
  - 'packages/*'

# Disallow every dependency from running install/build scripts. Each entry
# must be set to `false` to silently skip the script, or `true` to allow it.
# pnpm 11 auto-appends new entries here whenever a dep has scripts, prompting
# an explicit decision per package.
allowBuilds:
  msgpackr-extract: false
  protobufjs: false

# Deliberate exceptions to the minimum release age. Each entry is pinned to the exact version it
# waives, so a later release of the same package is gated again rather than silently inheriting
# the exemption.
minimumReleaseAgeExclude:
  # Fixes the two upstream defects that made the consumer throw out of callback chains nothing
  # can catch: the connection pool now reports its closed state as a NetworkError rather than a
  # plain Error, and Consumer.#handleError classifies via the free `findErrorBy` instead of
  # calling `findBy` as a method on whatever it was handed.
  - '@platformatic/kafka@2.9.0'
  # Kept on one AWS SDK line across the workspace. Mixed versions resolve duplicate
  # `@aws-sdk/core` and `@smithy/types` copies, which makes the SNS/SQS payload-store test types
  # mutually unassignable.
  - '@aws-sdk/client-s3@3.1106.0'
  - '@aws-sdk/client-sns@3.1106.0'
  - '@aws-sdk/client-sqs@3.1106.0'

# Hoist all dependencies to the workspace root to preserve npm-compatible
# resolution behavior for transitive deps used directly in test files.
shamefullyHoist: true
