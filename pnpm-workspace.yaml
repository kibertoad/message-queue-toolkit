packages:
  - 'packages/*'

# Disallow every dependency from running install/build scripts. Each entry
# must be set to `false` to silently skip the script, or `true` to allow it.
# pnpm 11 auto-appends new entries here whenever a dep has scripts, prompting
# an explicit decision per package.
allowBuilds:
  msgpackr-extract: false
  protobufjs: false

# Deliberate exception to the minimum release age. 2.9.0 fixes the two upstream defects that
# made the consumer throw out of callback chains nothing can catch: the connection pool now
# reports its closed state as a NetworkError rather than a plain Error, and Consumer.#handleError
# classifies via the free `findErrorBy` instead of calling `findBy` as a method on whatever it
# was handed. Worth taking ahead of the usual soak time.
minimumReleaseAgeExclude:
  - '@platformatic/kafka@2.9.0'

# Hoist all dependencies to the workspace root to preserve npm-compatible
# resolution behavior for transitive deps used directly in test files.
shamefullyHoist: true
